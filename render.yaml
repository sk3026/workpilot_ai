services:
  - type: web
    name: workpilot
    env: python
    region: singapore
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install --no-cache-dir -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.12
